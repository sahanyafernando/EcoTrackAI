[project]
name = "EcoTrackHackathon"
version = "0.1.0"
description = "EcoTrack AI identity and organization verification"
entry-point = "main"
kind = "web-app"
jac-version = "==0.37.23"

[dependencies]
[dependencies.npm]
react = "^19.2.0"
react-dom = "^19.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.7.0"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"



[dev-dependencies]
watchdog = ">=3.0.0"

[client]

# EcoTrack authority is configured through server-side root IDs.
# Disable the separate runtime admin portal and its default-account bootstrap.
[scale.admin]
enabled = false

# Enables Jac-native byLLM hosted-provider dependencies; model chosen via server env.
[byllm]
